name: media-research
# Parallel research workers on GitHub-hosted runners. Trigger: Actions tab -> Run workflow (plan path input),
# or let mr.py write research_runs/trigger.json ({"plan": path, "nonce": ...}) and push it. Text results (manifest + report) are committed to branch `research-results`;
# media files are kept as workflow artifacts (short retention).
on:
  workflow_dispatch:
    inputs:
      plan:
        description: 'Path to plan JSON'
        required: true
        default: 'research_plans/gta6-crash-physics.json'
  push:
    paths: ['research_runs/trigger.json']
permissions:
  contents: write
concurrency:
  group: media-research-${{ github.ref }}
  cancel-in-progress: false
jobs:
  setup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      plan: ${{ steps.p.outputs.plan }}
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - id: p
        run: |
          PLAN="${{ github.event.inputs.plan }}"
          if [ -z "$PLAN" ]; then PLAN=$(jq -r .plan research_runs/trigger.json); fi
          test -f "$PLAN" || { echo "plan not found: $PLAN"; exit 1; }
          echo "plan=$PLAN" >> $GITHUB_OUTPUT
          echo "matrix=$(jq -c '{include:[.jobs[]|{job:.id,type:.type}]}' "$PLAN")" >> $GITHUB_OUTPUT
  research:
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJson(needs.setup.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        id: cache
        with:
          path: out/${{ matrix.job }}
          key: research-${{ matrix.job }}-${{ hashFiles(needs.setup.outputs.plan, 'media_researcher/worker.py', 'media_researcher/common.py') }}
      - uses: actions/setup-python@v5
        if: steps.cache.outputs.cache-hit != 'true'
        with: { python-version: '3.12', cache: pip, cache-dependency-path: media_researcher/requirements.txt }
      - name: Install deps
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          pip install -r media_researcher/requirements.txt
          if [ "${{ matrix.type }}" = "web" ]; then python -m playwright install --with-deps chromium; fi
      - name: Run worker (one retry on failure)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          for i in 1 2; do python media_researcher/worker.py "${{ needs.setup.outputs.plan }}" "${{ matrix.job }}" out/${{ matrix.job }} && break; echo "retry"; sleep 20; done
          test -f out/${{ matrix.job }}/results.json
      - uses: actions/upload-artifact@v4
        with:
          name: research-${{ matrix.job }}
          path: out/${{ matrix.job }}
          retention-days: 3
  consolidate:
    needs: [setup, research]
    if: always() && needs.setup.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pillow requests
      - uses: actions/download-artifact@v4
        with: { pattern: 'research-*', path: results }
      - name: Consolidate
        run: |
          PLAN="${{ needs.setup.outputs.plan }}"
          python media_researcher/consolidate.py "$PLAN" results package "${PLAN%.json}.permissions.json"
      - uses: actions/upload-artifact@v4
        with: { name: research-package, path: package, retention-days: 7 }
      - name: Commit text results (manifest + report only) to research-results branch
        run: |
          export RUN=run-${{ github.run_id }}
          export PLAN="${{ needs.setup.outputs.plan }}"
          mkdir -p /tmp/rr && cp package/asset_manifest.json package/report.md /tmp/rr/
          git config user.name "media-research[bot]"; git config user.email "noreply@github.com"
          PP="${PLAN%.json}.permissions.json"; cp "$PP" /tmp/rr/permissions.json 2>/dev/null || true
          git fetch origin research-results 2>/dev/null && git checkout research-results || git checkout --orphan research-results
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p $RUN && cp /tmp/rr/* $RUN/
          # also commit media whose licence is machine-identified as open (CC / public domain); everything else stays in the artifact
          python3 - <<'PY'
          import json,re,shutil,os
          RUN=os.environ['RUN']
          pp='/tmp/rr/permissions.json'
          COMMIT_APPROVED=os.path.exists(pp) and json.load(open(pp)).get('commit_approved_media',False)
          m=json.load(open('/tmp/rr/asset_manifest.json'))
          for a in m['assets']:
              u=(a.get('usage_permissions') or '')
              if a.get('filename') and not a['verification_status'].startswith('rejected') and (re.match(r'(CC|Creative Commons|Public domain|PD|open licence)',u,re.I) or ((u.startswith('approved by') or a.get('editor_eligible')) and COMMIT_APPROVED)):
                  os.makedirs(RUN+'/media',exist_ok=True); shutil.copy('package/'+a['filename'],RUN+'/media/')
          PY
          git add $RUN && git commit -m "research results $RUN" && git push origin HEAD:research-results
